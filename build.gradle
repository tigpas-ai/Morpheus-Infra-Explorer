buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.github.johnrengelman:shadow:8.1.1"
        classpath "com.morpheusdata:morpheus-plugin-gradle:1.3.1"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:$assetPipelineVersion"
    }
}


apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'idea'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'asset-pipeline'
apply plugin: 'com.morpheusdata.morpheus-plugin-gradle'


group = 'eu.liehne.morpheus.infraexplorer'
ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

java {
	sourceCompatibility = JavaVersion.toVersion('1.11')
    targetCompatibility = JavaVersion.toVersion('1.11')
}

repositories {
	mavenLocal()
	mavenCentral()
}

configurations {
	provided
}

dependencies {
	provided "com.morpheusdata:morpheus-plugin-api:$morpheusApiVersion"
	
	
	provided "org.codehaus.groovy:groovy-all:$groovyVersion"
	implementation 'commons-beanutils:commons-beanutils:1.9.3'
	implementation "org.slf4j:slf4j-api:$slf4jVersion"
	implementation "org.slf4j:slf4j-parent:$slf4jVersion"
	implementation 'commons-net:commons-net:3.6'

	// Include morpheus-core and it's dependencies
	testImplementation 'io.reactivex.rxjava3:rxjava:3.1.7'
	testImplementation 'org.apache.httpcomponents:httpclient:4.5.3'
	testImplementation 'org.apache.httpcomponents:httpcore:4.4.5'
	testImplementation "org.slf4j:slf4j-parent:$slf4jVersion"

	testImplementation "org.codehaus.groovy:groovy-all:$groovyVersion"
	testImplementation 'net.bytebuddy:byte-buddy:1.9.3'
	testImplementation 'org.objenesis:objenesis:2.6'
	testImplementation platform("org.spockframework:spock-bom:$spockVersion")
	testImplementation "org.spockframework:spock-core"
	testImplementation "org.spockframework:spock-junit4"  // you can remove this if your code does not rely on old JUnit 4 rules
	testImplementation 'cglib:cglib-nodep:3.2.12'
}


sourceSets {
	main {
		compileClasspath += configurations.provided
	}
	test {
		compileClasspath += configurations.provided
		runtimeClasspath += configurations.provided
	}
	// Integration test against a real Morpheus appliance (see docs/integration-test.md); not part of `check`
	integrationTest {
		compileClasspath += sourceSets.test.compileClasspath
		runtimeClasspath += sourceSets.test.runtimeClasspath
	}
}

//Set plugin metadata information here that gets written into the jar
jar {
	manifest {
		attributes(
				'Plugin-Class': 'eu.liehne.morpheus.infraexplorer.InfraExplorerPlugin',
				'Plugin-Version': version,
				'Morpheus-Name': 'Infra Explorer',
				'Morpheus-Organization': 'morpheus',
				'Morpheus-Code': 'infra-explorer',
				'Morpheus-Description': 'Hierarchical infrastructure navigation as an overlay: clusters, hosts, VMs, VM folders, networks and storage',
				'Morpheus-Logo': 'assets/morpheus.svg',
				'Morpheus-Logo-Dark': 'assets/morpheus.svg',
				'Morpheus-Labels': 'Plugin',
				'Morpheus-Min-Appliance-Version': "9.1.0"
		)
	}
}

assets {
	packagePlugin = false //leave this false for plugins
}


task(console, dependsOn: 'classes', type: JavaExec) {
	main = 'groovy.ui.Console'
	classpath = sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
}

test {
	useJUnitPlatform()
	testLogging {
		exceptionFormat = 'full'
		showStandardStreams = true
	}
}
tasks.assemble.dependsOn tasks.shadowJar

// Uploads the built jar to the appliance from MORPHEUS_URL, checks it and restores the previous state.
// Only one run per appliance at a time. Offline part only: ./gradlew integrationTest --tests '*PluginBaselineSpec'
tasks.register('integrationTest', Test) {
	description = 'Tests the built plugin on a Morpheus appliance and restores the previous plugin state.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	dependsOn tasks.shadowJar
	inputs.file(tasks.shadowJar.archiveFile)
	outputs.upToDateWhen { false }
	useJUnitPlatform()
	systemProperty 'infraExplorer.jar', tasks.shadowJar.archiveFile.get().asFile.absolutePath
	systemProperty 'infraExplorer.projectDir', projectDir.absolutePath
	if (System.getenv('MORPHEUS_INSECURE') == '1') {
		// java.net.http checks the host name even with a trust-all trust manager
		systemProperty 'jdk.internal.httpclient.disableHostnameVerification', 'true'
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'full'
		showStandardStreams = true
	}
}
