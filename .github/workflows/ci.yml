name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Unit tests and build
        run: ./gradlew --no-daemon test shadowJar
